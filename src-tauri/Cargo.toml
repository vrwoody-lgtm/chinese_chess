[package]
name = "chinese-chess"
version = "0.2.0"
description = "Chinese chess game with Pikafish engine support"
authors = ["Local"]
edition = "2021"

[lib]
name = "chinese_chess"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
