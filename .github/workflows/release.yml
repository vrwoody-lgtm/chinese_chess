name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install

      - name: Sync web assets
        run: npm run tauri:sync

      - name: Build Tauri (Windows)
        run: npm run tauri:build -- --bundles msi nsis

      - name: List built bundles
        shell: bash
        run: |
          echo "=== msi ==="; ls -la src-tauri/target/release/bundle/msi/ 2>/dev/null || true
          echo "=== nsis ==="; ls -la src-tauri/target/release/bundle/nsis/ 2>/dev/null || true

      - name: Collect Windows artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/msi/*.msi dist/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install

      - name: Sync web assets
        run: npm run tauri:sync

      - name: Build Tauri (macOS)
        run: npm run tauri:build -- --bundles app dmg

      - name: List built bundles
        shell: bash
        run: |
          echo "=== dmg ==="; ls -la src-tauri/target/release/bundle/dmg/ 2>/dev/null || true
          echo "=== macos ==="; ls -la src-tauri/target/release/bundle/macos/ 2>/dev/null || true

      - name: Collect macOS artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/dmg/*.dmg dist/ 2>/dev/null || true
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app 2>/dev/null | head -n1)
          if [ -n "$APP" ]; then
            (cd "$(dirname "$APP")" && zip -r -y "$GITHUB_WORKSPACE/dist/$(basename "$APP" .app).app.zip" "$(basename "$APP")")
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
